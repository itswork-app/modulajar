name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/console-web
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ./apps/console-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api-ts
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ./apps/api-ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  core-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/core-go
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
            go-version: '1.21'
            cache-dependency-path: apps/core-go/go.sum
      - run: go test ./...

  worker-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/worker-go
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
            go-version: '1.21'
            cache-dependency-path: apps/worker-go/go.sum
      - run: go test ./...
