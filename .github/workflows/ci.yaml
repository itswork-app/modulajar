name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/console-web
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ./apps/console-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_ZXhjaXRpbmctc2hyZXctODguY2xlcmsuYWNjb3VudHMuZGV2JA npm run build

  api-ts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/api-ts
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: ./apps/api-ts/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  core-go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: modulajar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: ./apps/core-go
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
            go-version: '1.24'
            cache-dependency-path: apps/core-go/go.sum
      
      - name: Install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium
          which chromium-browser || which chromium

      - name: Migrate DB
        run: goose -dir ../../migrations postgres "postgres://user:password@localhost:5432/modulajar_test?sslmode=disable" up

      - name: Run Tests with Coverage
        env:
          DATABASE_URL: "postgres://user:password@localhost:5432/modulajar_test?sslmode=disable"
          DID_SECRET: "test-did-secret"
          PID_SECRET: "test-pid-secret"
          CHROME_BIN: "/usr/bin/chromium-browser"
        run: |
          go test -coverprofile=coverage.out ./...
          echo "=== Coverage Summary ==="
          go tool cover -func=coverage.out | tail -1

  worker-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/worker-go
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
            go-version: '1.24'
            cache-dependency-path: apps/worker-go/go.sum
      - run: go test ./...

  migration-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: modulajar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install goose
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
      - name: Verify Migration Up
        run: goose -dir migrations postgres "postgres://user:password@localhost:5432/modulajar_test?sslmode=disable" up
      - name: Verify Migration Down
        run: goose -dir migrations postgres "postgres://user:password@localhost:5432/modulajar_test?sslmode=disable" down
      - name: Verify Idempotency (Up Again)
        run: goose -dir migrations postgres "postgres://user:password@localhost:5432/modulajar_test?sslmode=disable" up
