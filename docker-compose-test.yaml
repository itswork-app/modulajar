version: '3.8'
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: modulajar_test
    ports:
      - "5433:5432" # Use 5433 to avoid conflict with local default 5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d modulajar_test" ]
      interval: 5s
      timeout: 5s
      retries: 5
